      {/* Notifikasi Overdue */}
      {overdue?.length>0&&(
        <div className="notif-card notif-high" style={{marginBottom:8}}>
          <span style={{fontSize:20}}>🚨</span>
          <div>
            <div style={{fontWeight:700,fontSize:13}}>HUTANG JATUH TEMPO: {overdue.length} Faktur</div>
            <div style={{fontSize:12}}>Total: {IDR(debt_stats?.overdue_amount||0)} — Segera lakukan pembayaran!</div>
            <div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:4}}>
              {overdue.slice(0,3).map(d=>(
                <span key={d.id} style={{fontSize:11,background:'#fee2e2',color:C.red,padding:'2px 8px',borderRadius:12,fontWeight:700}}>
                  {d.invoice_no} ({IDR(d.remaining_amount)})
                </span>
              ))}
              {overdue.length>3&&<span style={{fontSize:11,color:C.gray}}>+{overdue.length-3} lainnya</span>}
            </div>
          </div>
        </div>
      )}

      {due_today?.length>0&&(
        <div className="notif-card notif-high" style={{marginBottom:8}}>
          <span style={{fontSize:20}}>⏰</span>
          <div>
            <div style={{fontWeight:700,fontSize:13}}>JATUH TEMPO HARI INI: {due_today.length} Faktur</div>
            <div style={{fontSize:12}}>{due_today.map(d=>d.invoice_no).join(', ')}</div>
          </div>
        </div>
      )}

      {due_7days?.length>0&&(
        <div className="notif-card notif-med" style={{marginBottom:14}}>
          <span style={{fontSize:20}}>📅</span>
          <div>
            <div style={{fontWeight:700,fontSize:13}}>Jatuh Tempo 7 Hari: {due_7days.length} Faktur</div>
            <div style={{fontSize:12}}>{due_7days.map(d=>`${d.invoice_no} (${fmtDate(d.due_date)})`).join(' | ')}</div>
          </div>
        </div>
      )}

      {/* Main Metrics */}
      <div className="g5" style={{marginBottom:16}}>
        <div className="metric">
          <div className="m-lbl">🛒 Omzet Bulan Ini</div>
          <div className="m-val" style={{fontSize:15}}>{IDR(sales_month?.revenue||0)}</div>
          <div className="m-sub">{sales_month?.tx_count||0} transaksi</div>
        </div>
        <div className="metric">
          <div className="m-lbl">🛍 Pembelian Bulan Ini</div>
          <div className="m-val" style={{fontSize:15}}>{IDR(purchase_month?.total||0)}</div>
          <div className="m-sub">{purchase_month?.count||0} faktur</div>
        </div>
        <div className="metric amber">
          <div className="m-lbl">💳 Total Hutang Aktif</div>
          <div className="m-val amber" style={{fontSize:15}}>{IDR(debt_stats?.total_debt||0)}</div>
          <div className="m-sub">{debt_stats?.active_count||0} faktur aktif</div>
        </div>
        <div className="metric red">
          <div className="m-lbl">⚠ Hutang Overdue</div>
          <div className="m-val red" style={{fontSize:15}}>{IDR(debt_stats?.overdue_amount||0)}</div>
          <div className="m-sub">{debt_stats?.overdue_count||0} faktur</div>
        </div>
        <div className={'metric'+(cash_balance<0?' red':'')}>
          <div className="m-lbl">💰 Saldo Kas</div>
          <div className={'m-val'+(cash_balance<0?' red':'')} style={{fontSize:15}}>{IDR(cash_balance||0)}</div>
          <div className="m-sub">{cash_balance>=0?'Normal':'Defisit ⚠'}</div>
        </div>
      </div>

      <div className="g4" style={{marginBottom:16}}>
        <div className="metric blue">
          <div className="m-lbl">🏭 Total Distributor</div>
          <div className="m-val blue">{dist_count||0}</div>
        </div>
        <div className="metric">
          <div className="m-lbl">⬇ Kas Masuk Bulan Ini</div>
          <div className="m-val" style={{color:C.green,fontSize:15}}>{IDR(kas_masuk_month||0)}</div>
        </div>
        <div className="metric amber">
          <div className="m-lbl">⬆ Kas Keluar Bulan Ini</div>
          <div className="m-val amber" style={{fontSize:15}}>{IDR(kas_keluar_month||0)}</div>
        </div>
        <div className="metric red">
          <div className="m-lbl">📦 Stok Menipis / Habis</div>
          <div className="m-val red">{(low_stock||0)+(out_stock||0)}</div>
          <div className="m-sub">{out_stock||0} habis, {low_stock||0} rendah</div>
        </div>
      </div>

      <div className="g2">
        {/* Top 10 Distributor Hutang */}
        <div className="card">
          <div className="section-title">🏆 Top Distributor Hutang Terbesar</div>
          {!top_debtors?.length&&<div style={{color:C.gray,fontSize:13,padding:8}}>Tidak ada hutang aktif</div>}
          {top_debtors?.map((d,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #f0f8f2'}}>
              <div>
                <span style={{color:C.gray,fontSize:11,marginRight:8}}>#{i+1}</span>
                <span style={{fontWeight:600,fontSize:13}}>{d.name}</span>
                {d.sales_name&&<span style={{fontSize:11,color:C.gray,marginLeft:6}}>{d.sales_name}</span>}
              </div>
              <span style={{fontWeight:700,color:C.red,fontSize:13}}>{IDR(d.total_debt)}</span>
            </div>
          ))}
        </div>

        {/* Faktur Jatuh Tempo */}
        <div className="card">
          <div className="section-title">📅 Faktur Jatuh Tempo 7 Hari</div>
          {!due_7days?.length&&!overdue?.length&&<div style={{color:C.gray,fontSize:13,padding:8}}>Tidak ada faktur jatuh tempo dalam 7 hari 🎉</div>}
          {overdue?.map(d=>(
            <div key={d.id} className="notif-card notif-high" style={{margin:'4px 0',padding:'8px 10px'}}>
              <div>
                <div style={{fontWeight:700,fontSize:12}}>{d.invoice_no} — {d.distributor_name}</div>
                <div style={{fontSize:11,color:C.red}}>Jatuh Tempo: {fmtDate(d.due_date)} • Sisa: {IDR(d.remaining_amount)}</div>
              </div>
            </div>
          ))}
          {due_7days?.map(d=>(
            <div key={d.id} className="notif-card notif-med" style={{margin:'4px 0',padding:'8px 10px'}}>
              <div>
                <div style={{fontWeight:700,fontSize:12}}>{d.invoice_no} — {d.distributor_name}</div>
                <div style={{fontSize:11,color:C.amber}}>Jatuh Tempo: {fmtDate(d.due_date)} • Sisa: {IDR(d.remaining_amount)}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}


/* ── APP ROOT ── */
function App(){
  const [user,setUser]=useState(null);
  const [lang,setLang]=useState('id');
  const [page,setPage]=useState('dashboard');
  const [settings,setSettings]=useState({});
  const [ready,setReady]=useState(false);
  const [toast,setToast]=useState(null);

  const loadSettings=async()=>{
    try{const r=await API.get('/settings');setSettings(r.data);if(r.data.lang)setLang(r.data.lang);}catch(e){}
  };

  useEffect(()=>{
    loadSettings().then(()=>{
      const stored=localStorage.getItem('tokoku_user');
      if(stored){try{setUser(JSON.parse(stored));}catch(e){}}
      setReady(true);
      document.getElementById('init-loader').style.display='none';
    });
  },[]);

  useEffect(()=>{
    if(user)localStorage.setItem('tokoku_user',JSON.stringify(user));
    else localStorage.removeItem('tokoku_user');
  },[user]);

  const showToast=(msg,type='ok')=>{
    setToast({msg,type});
    setTimeout(()=>setToast(null),3200);
  };

  const logout=async()=>{
    try{await API.post('/logout',{user_id:user.id,name:user.name});}catch(e){}
    setUser(null);setPage('dashboard');
  };

  if(!ready)return null;
  if(!user)return<LoginScreen onLogin={u=>{setUser(u);setPage('dashboard');}} lang={lang} setLang={setLang}/>;

  const t=T[lang];

  const nav=[
    {id:'dashboard',i:'📊',l:'Dashboard',r:['owner','admin']},
    {id:'pos',i:'🛒',l:t.pos,r:['owner','admin','cashier']},
    {id:'products',i:'📦',l:t.products,r:['owner','admin']},
    {id:'customers',i:'👥',l:t.customers,r:['owner','admin']},
    {id:'txhistory',i:'📋',l:t.txHistory,r:['owner','admin']},
    {id:'distributor',i:'🏭',l:t.distributor,r:['owner','admin']},
    {id:'pembelian',i:'🛍',l:t.pembelian,r:['owner','admin']},
    {id:'hutang',i:'💳',l:t.hutang,r:['owner','admin']},
    {id:'kas',i:'💰',l:t.kas,r:['owner','admin']},
    {id:'laporanKeu',i:'📈',l:t.laporanKeu,r:['owner','admin']},
    {id:'reports',i:'📊',l:'Lap. Penjualan',r:['owner','admin']},
    {id:'settings',i:'⚙️',l:t.settings,r:['owner','admin']},
  ].filter(n=>n.r.includes(user.role));

  const pageLabel=Object.fromEntries(nav.map(n=>[n.id,n.l]));
  const roleLabel={owner:'Pemilik',admin:'Admin',cashier:'Kasir'};

  const navSections=[
    {label:'Penjualan',ids:['dashboard','pos','products','customers','txhistory']},
    {label:'Pembelian & Keuangan',ids:['distributor','pembelian','hutang','kas','laporanKeu']},
    {label:'Laporan & Sistem',ids:['reports','settings']},
  ];

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>🛒 TokoKu POS</h1>
          <p>{settings.storeName||'Toko Kelontong'}</p>
        </div>
        <div style={{padding:'6px 0',flex:1}}>
          {navSections.map(section=>{
            const sectionNav=nav.filter(n=>section.ids.includes(n.id));
            if(sectionNav.length===0)return null;
            return(
              <div key={section.label}>
                <div className="nav-section">{section.label}</div>
                {sectionNav.map(n=>(
                  <div key={n.id} className={'nav-item'+(page===n.id?' active':'')} onClick={()=>setPage(n.id)}>
                    <span style={{fontSize:16,width:22,textAlign:'center'}}>{n.i}</span>{n.l}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
        <div style={{padding:'10px 8px',borderTop:'1px solid rgba(255,255,255,0.1)'}}>
          <div style={{padding:'8px 14px 10px',fontSize:12}}>
            <div style={{opacity:0.65,fontSize:11,marginBottom:2}}>{roleLabel[user.role]}</div>
            <div style={{fontWeight:700,fontSize:14}}>{user.name}</div>
          </div>
          <div className="nav-item" onClick={logout} style={{color:'rgba(255,255,255,0.7)'}}>
            <span style={{fontSize:16,width:22,textAlign:'center'}}>🚪</span>{t.logout}
          </div>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div style={{fontSize:15,fontWeight:700}}>{pageLabel[page]||page}</div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div className="lang-row">
              <button className={'lang-btn'+(lang==='id'?' on':'')} onClick={()=>{setLang('id');API.put('/settings',{lang:'id'});}}>🇮🇩 ID</button>
              <button className={'lang-btn'+(lang==='en'?' on':'')} onClick={()=>{setLang('en');API.put('/settings',{lang:'en'});}}>🇺🇸 EN</button>
            </div>
            <span className={'badge '+(user.role==='owner'?'badge-g':user.role==='admin'?'badge-a':'tgy tag')}>
              {user.role==='owner'?'👑':user.role==='admin'?'🛠':'💳'} {roleLabel[user.role]}
            </span>
          </div>
        </div>

        <div style={{flex:1,overflow:page==='pos'?'hidden':'auto',minHeight:0}}>
          {page==='pos'&&<POSScreen user={user} lang={lang} showToast={showToast} settings={settings}/>}
          {page!=='pos'&&(
            <div className="content">
              {page==='dashboard'&&<DashboardScreen user={user} showToast={showToast}/>}
              {page==='products'&&<ProductsScreen user={user} lang={lang} showToast={showToast}/>}
              {page==='customers'&&<CustomersScreen user={user} lang={lang} showToast={showToast}/>}
              {page==='txhistory'&&<TxHistoryScreen user={user} lang={lang} showToast={showToast}/>}
              {page==='distributor'&&<DistributorScreen user={user} showToast={showToast}/>}
              {page==='pembelian'&&<PembelianScreen user={user} showToast={showToast}/>}
              {page==='hutang'&&<HutangScreen user={user} showToast={showToast}/>}
              {page==='kas'&&<KasScreen user={user} showToast={showToast}/>}
              {page==='laporanKeu'&&<LaporanKeuScreen user={user} showToast={showToast}/>}
              {page==='reports'&&<ReportsScreen user={user} lang={lang}/>}
              {page==='settings'&&<SettingsScreen user={user} lang={lang} setLang={setLang} showToast={showToast} settings={settings} loadSettings={loadSettings}/>}
            </div>
          )}
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
