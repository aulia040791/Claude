                        {p.wholesale_price&&p.wholesale_price>0&&(
                          <span title={p.wholesale_price_manual?'Diisi manual':'Otomatis sistem (diskon 10%)'}
                            style={{fontSize:9,fontWeight:800,padding:'1px 5px',borderRadius:5,lineHeight:1.5,
                              background:p.wholesale_price_manual?'#7c3aed':'#1e40af',color:'white'}}>
                            {p.wholesale_price_manual?'★ manual':'auto'}
                          </span>
                        )}
                      </div>
                    </td>
                    <td>
                      <span style={{fontWeight:700,color:p.stock<=0?C.red:p.stock<=p.min_stock?C.amber:C.text}}>
                        {p.stock} {p.unit}
                      </span>
                      {p.stock<=0&&<span style={{marginLeft:4,fontSize:10,color:C.red}}>⚠ Habis</span>}
                      {p.stock>0&&p.stock<=p.min_stock&&<span style={{marginLeft:4,fontSize:10,color:C.amber}}>⚠ Rendah</span>}
                    </td>
                    <td>{p.min_stock} {p.unit}</td>
                    {!labelMode&&(
                      <td>
                        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                          <button className="btn btn-b btn-xs" onClick={e=>{e.stopPropagation();setStkModal(p);setStkAdj({delta:0,reason:''});}}>± Stok</button>
                          <button className="btn btn-s btn-xs" onClick={e=>{e.stopPropagation();setForm(p);setModal('edit');}}>✏</button>
                          <button className="btn btn-d btn-xs" onClick={e=>{e.stopPropagation();setConfirm(p);}}>🗑</button>
                        </div>
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {modal&&(
        <Modal title={modal==='add'?'Tambah Produk':'Edit Produk'} onClose={()=>setModal(null)}>
          <div className="g2">
            <div className="fg"><label className="fl">Barcode</label><input value={form.barcode||''} onChange={e=>setForm(f=>({...f,barcode:e.target.value}))}/></div>
            <div className="fg"><label className="fl">Kategori</label>
              <select value={form.category||''} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                {cats.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
              </select>
            </div>
          </div>
          <div className="fg"><label className="fl">Nama Produk *</label><input value={form.name||''} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="g2">
            <div className="fg"><label className="fl">Harga Beli</label><input type="number" value={form.buy_price||0} onChange={e=>setForm(f=>({...f,buy_price:Number(e.target.value)}))}/></div>
            <div className="fg"><label className="fl">Harga Eceran *</label><input type="number" value={form.price||0} onChange={e=>{
              const retail=Number(e.target.value);
              setForm(f=>{
                // Jika grosir masih otomatis, recalculate
                const newWs=f.wholesale_price_manual?f.wholesale_price:Math.round(retail*0.9);
                return {...f,price:retail,wholesale_price:newWs};
              });
            }}/></div>
          </div>
          {/* Harga Grosir */}
          <div className="fg">
            <label className="fl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>Harga Grosir
                {form.wholesale_price_manual
                  ?<span style={{marginLeft:6,fontSize:10,background:'#7c3aed',color:'white',padding:'1px 6px',borderRadius:5}}>★ manual</span>
                  :<span style={{marginLeft:6,fontSize:10,background:'#1e40af',color:'white',padding:'1px 6px',borderRadius:5}}>auto</span>
                }
              </span>
              {form.wholesale_price_manual
                ?<button type="button" onClick={()=>setForm(f=>({...f,wholesale_price:Math.round((f.price||0)*0.9),wholesale_price_manual:0}))}
                    style={{fontSize:10,color:C.gray,background:'none',border:'1px solid #d1d5db',borderRadius:6,padding:'2px 8px',cursor:'pointer'}}>
                    Reset ke otomatis
                  </button>
                :<span style={{fontSize:10,color:C.gray}}>Diskon 10% dari eceran · Edit untuk manual</span>
              }
            </label>
            <input type="number"
              value={form.wholesale_price||''}
              placeholder={form.price?'Kosong = ikut harga eceran':'Isi harga eceran dulu'}
              onChange={e=>{
                const val=e.target.value;
                setForm(f=>({...f,
                  wholesale_price:val===''?null:Number(val),
                  wholesale_price_manual:val===''?0:1,
                }));
              }}
              style={{borderColor:form.wholesale_price_manual?'#7c3aed':'#d1e8d5'}}
            />
            {form.price>0&&form.wholesale_price&&form.wholesale_price>0&&(
              <div style={{fontSize:11,color:C.gray,marginTop:4}}>
                Selisih dari eceran: <strong style={{color:C.blue}}>{IDR(form.price-form.wholesale_price)}</strong>
                {' '}({(((form.price-form.wholesale_price)/form.price)*100).toFixed(1)}% diskon)
              </div>
            )}
          </div>
          <div className="g3">
            <div className="fg"><label className="fl">Stok</label><input type="number" value={form.stock||0} onChange={e=>setForm(f=>({...f,stock:Number(e.target.value)}))}/></div>
            <div className="fg"><label className="fl">Min. Stok</label><input type="number" value={form.min_stock||5} onChange={e=>setForm(f=>({...f,min_stock:Number(e.target.value)}))}/></div>
            <div className="fg"><label className="fl">Satuan</label>
              <select value={form.unit||'pcs'} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}>
                {['pcs','kg','gram','liter','ml','botol','karung','pack','lusin','dus','rim'].map(u=><option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={save}>Simpan</button>
          </div>
        </Modal>
      )}

      {stkModal&&(
        <Modal title={'Sesuaikan Stok: '+stkModal.name} onClose={()=>setStkModal(null)}>
          <div style={{textAlign:'center',marginBottom:16}}>
            <div style={{fontSize:13,color:C.gray}}>Stok Saat Ini</div>
            <div style={{fontSize:28,fontWeight:800}}>{stkModal.stock} {stkModal.unit}</div>
          </div>
          <div className="fg">
            <label className="fl">Perubahan Stok (+ tambah / - kurangi)</label>
            <input type="number" value={stkAdj.delta||''} onChange={e=>setStkAdj(s=>({...s,delta:Number(e.target.value)}))} placeholder="contoh: 10 atau -5"/>
          </div>
          <div className="fg"><label className="fl">Alasan *</label>
            <select value={stkAdj.reason} onChange={e=>setStkAdj(s=>({...s,reason:e.target.value}))}>
              <option value="">-- Pilih alasan --</option>
              <option value="Koreksi stok">Koreksi stok</option>
              <option value="Stok opname">Stok opname</option>
              <option value="Barang rusak">Barang rusak</option>
              <option value="Retur ke supplier">Retur ke supplier</option>
              <option value="Penambahan stok manual">Penambahan stok manual</option>
            </select>
          </div>
          {stkAdj.delta!==0&&<div style={{background:C.greenP,borderRadius:8,padding:'10px 14px',marginBottom:12}}>
            Stok setelah: <strong>{stkModal.stock + Number(stkAdj.delta)} {stkModal.unit}</strong>
          </div>}
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setStkModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={adjStock} disabled={!stkAdj.delta||!stkAdj.reason}>Simpan</button>
          </div>
        </Modal>
      )}
      {confirm&&<Confirm msg={`Hapus produk "${confirm.name}"?`} onOk={()=>del(confirm)} onCancel={()=>setConfirm(null)}/>}
    </div>
  );
}

/* ── CUSTOMERS SCREEN ── */
function CustomersScreen({user,lang,showToast}){
  const [custs,setCusts]=useState([]);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [payM,setPayM]=useState(null);
  const [payAmt,setPayAmt]=useState('');
  const [srch,setSrch]=useState('');

  const load=()=>API.get('/customers').then(r=>setCusts(r.data)).catch(()=>{});
  useEffect(()=>{load();},[]);

  const filtered=useMemo(()=>{
    if(!srch)return custs;
    return custs.filter(c=>c.name.toLowerCase().includes(srch.toLowerCase())||c.phone?.includes(srch));
  },[custs,srch]);

  const save=async()=>{
    try{
      if(modal==='add')await API.post('/customers',form);
      else await API.put('/customers/'+form.id,form);
      showToast('Data pelanggan disimpan','ok');setModal(null);load();
    }catch(e){showToast(e.message,'error');}
  };

  const payDebt=async()=>{
    const amt=Number(payAmt);
    if(amt<=0||amt>payM.debt_rem){showToast('Nominal tidak valid','error');return;}
    try{
      await API.post('/debts/pay',{customer_id:payM.id,amount:amt,user_id:user.id});
      showToast('Pembayaran dicatat','ok');setPayM(null);setPayAmt('');load();
    }catch(e){showToast(e.message,'error');}
  };

  return(
    <div>
      <div className="page-header">
        <div className="page-title">👥 Pelanggan</div>
        <button className="btn btn-p btn-sm" onClick={()=>{setForm({name:'',phone:'',address:'',notes:''});setModal('add');}}>+ Tambah</button>
      </div>
      <div className="filter-bar">
        <div className="srch" style={{flex:1,maxWidth:320}}>
          <span className="srch-ico">🔍</span>
          <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Cari nama / telepon..."/>
        </div>
      </div>
      <div className="tbl-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Telepon</th><th>Alamat</th><th>Harga Default</th><th>Total Hutang</th><th>Sisa Hutang</th><th>Aksi</th></tr></thead>
          <tbody>
            {filtered.map(c=>(
              <tr key={c.id}>
                <td><span style={{fontWeight:600}}>{c.name}</span><div style={{fontSize:11,color:C.gray}}>{c.notes}</div></td>
                <td>{c.phone||'-'}</td>
                <td style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.address||'-'}</td>
                <td>
                  <span style={{fontSize:12,fontWeight:700,padding:'3px 10px',borderRadius:12,
                    background:c.pricing_type==='wholesale'?C.blueL:C.greenL,
                    color:c.pricing_type==='wholesale'?C.blue:C.green}}>
                    {c.pricing_type==='wholesale'?'Grosir':'Eceran'}
                  </span>
                </td>
                <td><span className="price">{IDR(c.debt_total)}</span></td>
                <td><span className="price" style={{color:c.debt_rem>0?C.red:C.green,fontWeight:700}}>{IDR(c.debt_rem)}</span></td>
                <td>
                  <div style={{display:'flex',gap:5}}>
                    {c.debt_rem>0&&<button className="btn btn-a btn-xs" onClick={()=>{setPayM(c);setPayAmt('');}}>💰 Bayar</button>}
                    <button className="btn btn-s btn-xs" onClick={()=>{setForm(c);setModal('edit');}}>✏</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal&&(
        <Modal title={modal==='add'?'Tambah Pelanggan':'Edit Pelanggan'} onClose={()=>setModal(null)}>
          <div className="fg"><label className="fl">Nama *</label><input value={form.name||''} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="fg"><label className="fl">Telepon</label><input value={form.phone||''} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/></div>
          <div className="fg"><label className="fl">Alamat</label><textarea value={form.address||''} onChange={e=>setForm(f=>({...f,address:e.target.value}))} rows={2}/></div>
          <div className="fg"><label className="fl">Catatan</label><input value={form.notes||''} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
          <div className="fg">
            <label className="fl">Harga Default</label>
            <div style={{display:'flex',gap:8,marginTop:2}}>
              {[['retail','Eceran','Harga normal / satuan'],['wholesale','Grosir','Harga khusus pelanggan grosir']].map(([val,label,desc])=>(
                <div key={val} onClick={()=>setForm(f=>({...f,pricing_type:val}))}
                  style={{flex:1,border:'2px solid',borderRadius:10,padding:'10px 12px',cursor:'pointer',transition:'all 0.15s',
                    borderColor:form.pricing_type===val?(val==='wholesale'?C.blue:C.green):'#e5e7eb',
                    background:form.pricing_type===val?(val==='wholesale'?C.blueL:C.greenL):'white'}}>
                  <div style={{fontWeight:700,fontSize:13,color:form.pricing_type===val?(val==='wholesale'?C.blue:C.green):C.text}}>
                    {form.pricing_type===val?'✓ ':''}{label}
                  </div>
                  <div style={{fontSize:11,color:C.gray,marginTop:2}}>{desc}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={save}>Simpan</button>
          </div>
        </Modal>
      )}

      {payM&&(
        <Modal title={'Bayar Hutang - '+payM.name} onClose={()=>setPayM(null)}>
          <div style={{background:C.redL,borderRadius:8,padding:'10px 14px',marginBottom:14}}>
            <div style={{fontSize:12,color:C.gray}}>Sisa Hutang</div>
            <div style={{fontSize:22,fontWeight:800,color:C.red}}>{IDR(payM.debt_rem)}</div>
          </div>
          <div className="fg"><label className="fl">Nominal Pembayaran</label>
            <input type="number" value={payAmt} onChange={e=>setPayAmt(e.target.value)} placeholder="0"/>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>setPayAmt(String(payM.debt_rem))}>Bayar Lunas</button>
            <button className="btn btn-p btn-sm" style={{flex:1}} onClick={payDebt}>Simpan Pembayaran</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ── TX HISTORY SCREEN ── */
function TxHistoryScreen({user,lang,showToast}){
  const [txs,setTxs]=useState([]);
  const [detailM,setDetailM]=useState(null);
  const [voidM,setVoidM]=useState(null);
  const [voidR,setVoidR]=useState('');
  const [from,setFrom]=useState(today());
  const [to,setTo]=useState(today());

  const load=()=>API.get(`/transactions?from=${from}&to=${to}`).then(r=>setTxs(r.data)).catch(()=>{});
  useEffect(()=>{load();},[from,to]);

  const openDetail=async tx=>{
    const items=await API.get('/transactions/'+tx.id+'/items');
    setDetailM({tx,items:items.data});
  };
  const doVoid=async()=>{
    try{
      await API.post('/transactions/'+voidM.id+'/void',{reason:voidR,voided_by:user.name,user_id:user.id});
      showToast('Transaksi dibatalkan','ok');setVoidM(null);setVoidR('');load();
    }catch(e){showToast(e.message,'error');}
  };

  const total=txs.reduce((s,t)=>t.status!=='void'?s+t.total:s,0);
  return(
    <div>
      <div className="page-header">
        <div className="page-title">📋 Riwayat Transaksi</div>
      </div>
      <div className="filter-bar">
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:'auto'}}/>
        <span style={{fontSize:12,color:C.gray}}>s/d</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:'auto'}}/>
        <button className="btn btn-s btn-sm" onClick={load}>Tampilkan</button>
        <div style={{marginLeft:'auto',fontWeight:700,fontSize:14}}>Total: <span style={{color:C.green}}>{IDR(total)}</span></div>
      </div>
      <div className="tbl-wrap">
        <table>
          <thead><tr><th>Tgl</th><th>Kasir</th><th>Pelanggan</th><th>Total</th><th>Metode</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody>
            {txs.map(tx=>(
              <tr key={tx.id} style={{opacity:tx.status==='void'?0.5:1}}>
                <td style={{fontSize:12}}>{fmtDT(tx.date)}</td>
                <td>{tx.cashier_name}</td>
                <td>{tx.customer_name||'-'}</td>
                <td><span className="price" style={{fontWeight:700}}>{IDR(tx.total)}</span></td>
                <td><span className="tag tgy">{tx.payment_method}</span></td>
                <td>{tx.status==='void'?<span className="tag tr">Void</span>:tx.status==='done'?<span className="tag tg">Selesai</span>:<span className="tag ta">{tx.status}</span>}</td>
                <td>
                  <div style={{display:'flex',gap:5}}>
                    <button className="btn btn-s btn-xs" onClick={()=>openDetail(tx)}>Detail</button>
                    {tx.status!=='void'&&user.role!=='cashier'&&
                      <button className="btn btn-d btn-xs" onClick={()=>{setVoidM(tx);setVoidR('');}}>Void</button>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {detailM&&(
        <Modal title={`Detail Transaksi #${detailM.tx.id}`} onClose={()=>setDetailM(null)}>
          <div className="g2" style={{marginBottom:12}}>
            <div><div style={{fontSize:11,color:C.gray}}>Tanggal</div><div style={{fontWeight:600}}>{fmtDT(detailM.tx.date)}</div></div>
            <div><div style={{fontSize:11,color:C.gray}}>Kasir</div><div style={{fontWeight:600}}>{detailM.tx.cashier_name}</div></div>
          </div>
          <table>
            <thead><tr><th>Produk</th><th>Qty</th><th>Harga</th><th>Subtotal</th></tr></thead>
            <tbody>
              {detailM.items.map(i=>(
                <tr key={i.id}><td>{i.name}</td><td>{i.qty}</td><td>{IDR(i.price)}</td><td>{IDR(i.subtotal)}</td></tr>
              ))}
            </tbody>
          </table>
          <div style={{borderTop:'2px solid #e2f0e5',marginTop:10,paddingTop:10}}>
            <div style={{display:'flex',justifyContent:'space-between',fontWeight:800,fontSize:16}}>
              <span>Total</span><span style={{color:C.green}}>{IDR(detailM.tx.total)}</span>
            </div>
            <div style={{fontSize:12,color:C.gray,marginTop:4}}>Metode: {detailM.tx.payment_method} | Dibayar: {IDR(detailM.tx.payment_amount)}</div>
          </div>
          {detailM.tx.status==='void'&&<div className="alert-w alert-r" style={{marginTop:12}}>Void: {detailM.tx.void_reason}</div>}
        </Modal>
      )}
      {voidM&&(
        <Modal title={'Batalkan Transaksi #'+voidM.id} onClose={()=>setVoidM(null)}>
          <div className="fg"><label className="fl">Alasan Pembatalan *</label>
            <input value={voidR} onChange={e=>setVoidR(e.target.value)} placeholder="Alasan..."/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setVoidM(null)}>Batal</button>
            <button className="btn btn-d btn-sm" onClick={doVoid} disabled={!voidR}>Batalkan Transaksi</button>
          </div>
        </Modal>
      )}
    </div>
  );
}


/* ── DISTRIBUTOR SCREEN ── */
function DistributorScreen({user,showToast}){
  const [dists,setDists]=useState([]);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [confirm,setConfirm]=useState(null);
  const [ledgerM,setLedgerM]=useState(null);
  const [srch,setSrch]=useState('');

  const load=()=>API.get('/distributors').then(r=>setDists(r.data)).catch(()=>{});
  useEffect(()=>{load();},[]);

  const filtered=useMemo(()=>{
    if(!srch)return dists;
    const q=srch.toLowerCase();
    return dists.filter(d=>d.name.toLowerCase().includes(q)||d.sales_name?.toLowerCase().includes(q)||d.phone?.includes(q));
  },[dists,srch]);

  const save=async()=>{
    try{
      if(modal==='add')await API.post('/distributors',{...form,user_id:user.id});
      else await API.put('/distributors/'+form.id,{...form,user_id:user.id});
      showToast('Data distributor disimpan','ok');setModal(null);load();
    }catch(e){showToast(e.message,'error');}
  };

  const del=async d=>{
    try{
      await API.delete('/distributors/'+d.id,{user_id:user.id});
      showToast('Distributor dinonaktifkan','ok');setConfirm(null);load();
    }catch(e){showToast(e.message,'error');}
  };

  const openLedger=async d=>{
    try{
      const r=await API.get('/distributors/'+d.id+'/ledger');
      setLedgerM(r.data);
    }catch(e){showToast(e.message,'error');}
  };

  const emptyForm={name:'',sales_name:'',phone:'',address:'',notes:'',active:1};
  return(
    <div>
      <div className="page-header">
        <div className="page-title">🏭 Distributor</div>
        <button className="btn btn-p btn-sm" onClick={()=>{setForm(emptyForm);setModal('add');}}>+ Tambah Distributor</button>
      </div>
      <div className="filter-bar">
        <div className="srch" style={{flex:1,maxWidth:340}}>
          <span className="srch-ico">🔍</span>
          <input value={srch} onChange={e=>setSrch(e.target.value)} placeholder="Cari nama / sales / telepon..."/>
        </div>
      </div>

      <div className="tbl-wrap">
        <div className="tbl-scroll">
          <table>
            <thead><tr>
              <th>Kode</th><th>Nama Distributor</th><th>Nama Sales</th><th>Telepon</th>
              <th>Total Pembelian</th><th>Total Hutang</th><th>Overdue</th><th>Status</th><th>Aksi</th>
            </tr></thead>
            <tbody>
              {filtered.map(d=>(
                <tr key={d.id}>
                  <td><span style={{fontFamily:'monospace',fontSize:12,color:C.gray}}>{d.code}</span></td>
                  <td>
                    <div style={{fontWeight:700}}>{d.name}</div>
                    {d.address&&<div style={{fontSize:11,color:C.gray}}>{d.address}</div>}
                  </td>
                  <td>{d.sales_name||'-'}</td>
                  <td>{d.phone||'-'}</td>
                  <td><span className="price">{IDR(d.total_purchase||0)}</span></td>
                  <td>
                    <span className="price" style={{color:(d.total_debt||0)>0?C.red:C.green,fontWeight:700}}>
                      {IDR(d.total_debt||0)}
                    </span>
                  </td>
                  <td>
                    {(d.overdue_count||0)>0
                      ? <span className="status-overdue">{d.overdue_count} Faktur</span>
                      : <span style={{color:C.gray,fontSize:12}}>-</span>}
                  </td>
                  <td>{d.active?<span className="tag tg">Aktif</span>:<span className="tag tr">Nonaktif</span>}</td>
                  <td>
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                      <button className="btn btn-b btn-xs" onClick={()=>openLedger(d)}>📊 Kartu</button>
                      <button className="btn btn-s btn-xs" onClick={()=>{setForm(d);setModal('edit');}}>✏</button>
                      <button className="btn btn-d btn-xs" onClick={()=>setConfirm(d)}>🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Summary Cards */}
      <div className="g4" style={{marginTop:16}}>
        <div className="metric">
          <div className="m-lbl">Total Distributor</div>
          <div className="m-val">{dists.filter(d=>d.active).length}</div>
        </div>
        <div className="metric">
          <div className="m-lbl">Total Pembelian</div>
          <div className="m-val" style={{fontSize:16}}>{IDR(dists.reduce((s,d)=>s+(d.total_purchase||0),0))}</div>
        </div>
        <div className="metric amber">
          <div className="m-lbl">Total Hutang Aktif</div>
          <div className="m-val amber" style={{fontSize:16}}>{IDR(dists.reduce((s,d)=>s+(d.total_debt||0),0))}</div>
        </div>
        <div className="metric red">
          <div className="m-lbl">Distributor Overdue</div>
          <div className="m-val red">{dists.filter(d=>(d.overdue_count||0)>0).length}</div>
        </div>
      </div>

      {/* Form Modal */}
      {modal&&(
        <Modal title={modal==='add'?'Tambah Distributor':'Edit Distributor'} onClose={()=>setModal(null)} wide>
          <div className="g2">
            <div className="fg"><label className="fl">Nama Distributor *</label>
              <input value={form.name||''} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
            </div>
            <div className="fg"><label className="fl">Nama Sales / PIC</label>
              <input value={form.sales_name||''} onChange={e=>setForm(f=>({...f,sales_name:e.target.value}))}/>
            </div>
          </div>
          <div className="g2">
            <div className="fg"><label className="fl">Nomor Telepon</label>
              <input value={form.phone||''} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/>
            </div>
            <div className="fg"><label className="fl">Status</label>
              <select value={form.active??1} onChange={e=>setForm(f=>({...f,active:Number(e.target.value)}))}>
                <option value={1}>Aktif</option>
                <option value={0}>Tidak Aktif</option>
              </select>
            </div>
          </div>
          <div className="fg"><label className="fl">Alamat</label>
            <textarea value={form.address||''} onChange={e=>setForm(f=>({...f,address:e.target.value}))} rows={2}/>
          </div>
          <div className="fg"><label className="fl">Catatan</label>
            <textarea value={form.notes||''} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={save}>Simpan</button>
          </div>
        </Modal>
      )}

      {/* Kartu Hutang Modal */}
      {ledgerM&&(
        <Modal title={`📊 Kartu Hutang: ${ledgerM.distributor?.name}`} onClose={()=>setLedgerM(null)} xl>
          <div className="g4" style={{marginBottom:16}}>
            <div className="metric"><div className="m-lbl">Total Pembelian</div><div className="m-val" style={{fontSize:15}}>{IDR(ledgerM.summary?.total_purchase)}</div></div>
            <div className="metric"><div className="m-lbl">Total Dibayar</div><div className="m-val" style={{fontSize:15,color:C.green}}>{IDR(ledgerM.summary?.total_paid)}</div></div>
            <div className="metric amber"><div className="m-lbl">Sisa Hutang</div><div className="m-val amber" style={{fontSize:15}}>{IDR(ledgerM.summary?.total_debt)}</div></div>
            <div className="metric red"><div className="m-lbl">Faktur Overdue</div><div className="m-val red">{ledgerM.summary?.overdue_invoices||0}</div></div>
          </div>
          <div className="tbl-wrap">
            <div className="tbl-scroll">
              <table className="ledger-table">
                <thead><tr>
                  <th>Tanggal</th><th>Referensi</th><th>Keterangan</th>
                  <th style={{textAlign:'right'}}>Debit (Hutang)</th>
                  <th style={{textAlign:'right'}}>Kredit (Bayar)</th>
                  <th style={{textAlign:'right'}}>Saldo</th>
                </tr></thead>
                <tbody>
                  {ledgerM.ledger?.map((row,i)=>(
                    <tr key={i}>
                      <td>{fmtDate(row.date)}</td>
                      <td><span style={{fontFamily:'monospace',fontSize:12}}>{row.reference}</span></td>
                      <td>{row.description}</td>
                      <td style={{textAlign:'right'}}>{row.debit>0?<span className="ledger-debit">{IDR(row.debit)}</span>:'-'}</td>
                      <td style={{textAlign:'right'}}>{row.credit>0?<span className="ledger-credit">{IDR(row.credit)}</span>:'-'}</td>
                      <td style={{textAlign:'right'}}><span className="ledger-balance" style={{color:row.balance>0?C.red:C.green}}>{IDR(row.balance)}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14}}>
            <button className="btn btn-s btn-sm" onClick={()=>setLedgerM(null)}>Tutup</button>
          </div>
        </Modal>
      )}
      {confirm&&<Confirm msg={`Nonaktifkan distributor "${confirm.name}"?`} onOk={()=>del(confirm)} onCancel={()=>setConfirm(null)}/>}
    </div>
  );
}

/* ── PEMBELIAN SCREEN ── */
function PembelianScreen({user,showToast}){
  const [invoices,setInvoices]=useState([]);
  const [dists,setDists]=useState([]);
  const [prods,setProds]=useState([]);
  const [modal,setModal]=useState(null);
  const [detailM,setDetailM]=useState(null);
  const [form,setForm]=useState({});
  const [items,setItems]=useState([]);
  const [statusF,setStatusF]=useState('all');
  const [srch,setSrch]=useState('');
  const [from,setFrom]=useState(monthStart());
  const [to,setTo]=useState(today());
  const [loading,setLoading]=useState(false);
  const [nextNo,setNextNo]=useState('');

  const load=()=>{
    let url=`/purchases?from=${from}&to=${to}`;
    if(statusF!=='all')url+=`&status=${statusF}`;
    if(srch)url+=`&search=${encodeURIComponent(srch)}`;
    API.get(url).then(r=>setInvoices(r.data)).catch(()=>{});
  };
  useEffect(()=>{
    load();
    API.get('/distributors').then(r=>setDists(r.data.filter(d=>d.active))).catch(()=>{});
    API.get('/products').then(r=>setProds(r.data)).catch(()=>{});
    API.get('/purchases/next-invoice-no').then(r=>setNextNo(r.data)).catch(()=>{});
  },[]);
  useEffect(()=>{load();},[from,to,statusF]);

  const openAdd=()=>{
    const d0=today();
    setForm({invoice_no:nextNo,invoice_date:d0,due_date:'',tempo_days:30,payment_type:'hutang_penuh',down_payment:0,payment_method:'transfer',notes:''});
    setItems([{product_id:'',product_name:'',qty:1,buy_price:0,subtotal:0}]);
    setModal('add');
  };

  const addItem=()=>setItems(i=>[...i,{product_id:'',product_name:'',qty:1,buy_price:0,subtotal:0}]);
  const removeItem=idx=>setItems(i=>i.filter((_,j)=>j!==idx));
  const updateItem=(idx,field,val)=>{
    setItems(i=>i.map((item,j)=>{
      if(j!==idx)return item;
      const updated={...item,[field]:val};
      if(field==='product_id'){
        const p=prods.find(p=>p.id===Number(val));
        if(p){updated.product_name=p.name;updated.buy_price=p.buy_price||0;}
      }
      if(field==='qty'||field==='buy_price'){
        updated.subtotal=(Number(updated.qty)||0)*(Number(updated.buy_price)||0);
      }
      if(field==='product_id'&&val){
        const p=prods.find(p=>p.id===Number(val));
        if(p)updated.subtotal=(Number(updated.qty)||0)*(p.buy_price||0);
      }
      return updated;
    }));
  };

  const totalAmount=items.reduce((s,i)=>s+(Number(i.subtotal)||0),0);

  const calcDueDate=()=>{
    if(form.invoice_date&&form.tempo_days){
      return addDays(form.invoice_date,Number(form.tempo_days));
    }
    return form.due_date||'';
  };

  const save=async()=>{
    if(!form.invoice_no||!form.distributor_id||!form.invoice_date){
      showToast('Lengkapi data faktur','error');return;
    }
    const validItems=items.filter(i=>i.product_id&&i.qty>0&&i.buy_price>0);
    if(validItems.length===0){showToast('Tambahkan minimal 1 item valid','error');return;}
    if(form.payment_type==='hutang_sebagian'&&Number(form.down_payment)<=0){
      showToast('Masukkan nominal DP untuk hutang sebagian','error');return;
    }
    setLoading(true);
    try{
      const dueDate=calcDueDate();
      await API.post('/purchases',{
        ...form,due_date:dueDate,
        items:validItems,
        total_amount:totalAmount,
        user_id:user.id,user_name:user.name,
      });
      showToast('Faktur pembelian disimpan','ok');
      setModal(null);load();
      API.get('/purchases/next-invoice-no').then(r=>setNextNo(r.data));
    }catch(e){showToast(e.message,'error');}
    setLoading(false);
  };

  const openDetail=async inv=>{
    try{
      const r=await API.get('/purchases/'+inv.id);
      setDetailM(r.data);
    }catch(e){showToast(e.message,'error');}
  };

  const statusTabs=['all','unpaid','partial','overdue','paid'];
  const statusLabel={all:'Semua',unpaid:'Belum Lunas',partial:'Sebagian',overdue:'Jatuh Tempo',paid:'Lunas'};

  return(
    <div>
      <div className="page-header">
        <div className="page-title">🛍 Pembelian Barang</div>
        <button className="btn btn-p btn-sm" onClick={openAdd}>+ Buat Faktur</button>
      </div>

      <div className="filter-bar">
        <div className="srch" style={{minWidth:240}}>
          <span className="srch-ico">🔍</span>
          <input value={srch} onChange={e=>setSrch(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="Cari nomor faktur / distributor..."/>
        </div>
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:'auto'}}/>
        <span style={{fontSize:12,color:C.gray}}>s/d</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:'auto'}}/>
        <button className="btn btn-s btn-sm" onClick={load}>Tampilkan</button>
        <a className="btn btn-b btn-sm" href={`/api/export/purchases?from=${from}&to=${to}`} target="_blank">⬇ Excel</a>
      </div>

      <div className="tabs" style={{marginBottom:12}}>
        {statusTabs.map(s=>(
          <div key={s} className={'tab'+(statusF===s?' on':'')} onClick={()=>setStatusF(s)}>{statusLabel[s]}</div>
        ))}
      </div>

      <div className="tbl-wrap">
        <div className="tbl-scroll">
          <table>
            <thead><tr>
              <th>No Faktur</th><th>Distributor</th><th>Tgl Faktur</th><th>Jatuh Tempo</th>
              <th>Tipe Bayar</th><th>Total</th><th>Dibayar</th><th>Sisa</th><th>Status</th><th>Aksi</th>
            </tr></thead>
            <tbody>
              {invoices.map(inv=>(
                <tr key={inv.id}>
                  <td><span style={{fontFamily:'monospace',fontSize:12,fontWeight:700}}>{inv.invoice_no}</span></td>
                  <td><span style={{fontWeight:600}}>{inv.distributor_name}</span></td>
                  <td>{fmtDate(inv.invoice_date)}</td>
                  <td style={{color:inv.status==='overdue'?C.red:inv.due_date&&inv.due_date<=today()?C.amber:C.text}}>
                    {fmtDate(inv.due_date)}
                    {inv.status==='overdue'&&<span style={{marginLeft:4,fontSize:10}}>⚠</span>}
                  </td>
                  <td>
                    <span className={'tag '+(inv.payment_type==='cash'?'tg':inv.payment_type==='hutang_penuh'?'ta':'tb')}>
                      {inv.payment_type==='cash'?'Cash':inv.payment_type==='hutang_penuh'?'Hutang Penuh':'Hutang Sebagian'}
                    </span>
                  </td>
                  <td><span className="price">{IDR(inv.total_amount)}</span></td>
                  <td><span className="price" style={{color:C.green}}>{IDR(inv.paid_amount)}</span></td>
                  <td><span className="price" style={{color:inv.remaining_amount>0?C.red:C.green,fontWeight:700}}>{IDR(inv.remaining_amount)}</span></td>
                  <td><StatusBadge status={inv.status}/></td>
                  <td>
                    <button className="btn btn-s btn-xs" onClick={()=>openDetail(inv)}>Detail</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* FORM MODAL */}
      {modal==='add'&&(
        <Modal title="Buat Faktur Pembelian" onClose={()=>setModal(null)} xl>
          <div className="g3">
            <div className="fg"><label className="fl">Nomor Faktur *</label>
              <input value={form.invoice_no||''} onChange={e=>setForm(f=>({...f,invoice_no:e.target.value}))}/>
            </div>
            <div className="fg"><label className="fl">Tanggal Faktur *</label>
              <input type="date" value={form.invoice_date||''} onChange={e=>setForm(f=>({...f,invoice_date:e.target.value}))}/>
            </div>
            <div className="fg"><label className="fl">Distributor *</label>
              <select value={form.distributor_id||''} onChange={e=>setForm(f=>({...f,distributor_id:Number(e.target.value)}))}>
                <option value="">-- Pilih Distributor --</option>
                {dists.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </div>
          </div>

          <div className="g3">
            <div className="fg"><label className="fl">Tipe Pembayaran *</label>
              <select value={form.payment_type||'hutang_penuh'} onChange={e=>setForm(f=>({...f,payment_type:e.target.value}))}>
                <option value="cash">Cash (Langsung Lunas)</option>
                <option value="hutang_penuh">Hutang Penuh</option>
                <option value="hutang_sebagian">Hutang Sebagian (DP)</option>
              </select>
            </div>
            {form.payment_type!=='cash'&&<>
              <div className="fg"><label className="fl">Tempo (Hari)</label>
                <input type="number" value={form.tempo_days||''} onChange={e=>{
                  const days=Number(e.target.value);
                  setForm(f=>({...f,tempo_days:days,due_date:form.invoice_date?addDays(form.invoice_date,days):''}));
                }} placeholder="e.g. 30"/>
              </div>
              <div className="fg"><label className="fl">Tanggal Jatuh Tempo</label>
                <input type="date" value={calcDueDate()} onChange={e=>setForm(f=>({...f,due_date:e.target.value,tempo_days:''}))}/>
              </div>
            </>}
          </div>

          {form.payment_type==='hutang_sebagian'&&(
            <div className="g2">
              <div className="fg"><label className="fl">DP / Dibayar Saat Ini (Rp) *</label>
                <input type="number" value={form.down_payment||''} onChange={e=>setForm(f=>({...f,down_payment:Number(e.target.value)}))} placeholder="0"/>
              </div>
              <div className="fg"><label className="fl">Metode Bayar DP</label>
                <select value={form.payment_method||'transfer'} onChange={e=>setForm(f=>({...f,payment_method:e.target.value}))}>
                  <option value="cash">Cash</option>
                  <option value="transfer">Transfer</option>
                  <option value="giro">Giro</option>
                </select>
              </div>
            </div>
          )}

          <div className="fg"><label className="fl">Catatan</label>
            <input value={form.notes||''} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Opsional"/>
          </div>

          <div style={{fontWeight:700,fontSize:14,marginBottom:10,marginTop:4}}>Detail Barang</div>
          <div className="tbl-wrap" style={{marginBottom:10}}>
            <div className="tbl-scroll">
              <table>
                <thead><tr><th style={{minWidth:200}}>Produk</th><th style={{minWidth:80}}>Qty</th><th style={{minWidth:120}}>Harga Beli</th><th style={{minWidth:120}}>Subtotal</th><th></th></tr></thead>
                <tbody>
                  {items.map((item,idx)=>(
                    <tr key={idx}>
                      <td>
                        <select value={item.product_id||''} onChange={e=>updateItem(idx,'product_id',e.target.value)} style={{minWidth:180}}>
                          <option value="">-- Pilih Produk --</option>
                          {prods.map(p=><option key={p.id} value={p.id}>{p.name} (Stok: {p.stock})</option>)}
                        </select>
                      </td>
                      <td><input type="number" value={item.qty||''} onChange={e=>updateItem(idx,'qty',Number(e.target.value))} style={{width:70}} min="1"/></td>
                      <td><input type="number" value={item.buy_price||''} onChange={e=>updateItem(idx,'buy_price',Number(e.target.value))} style={{width:110}}/></td>
                      <td><span className="price" style={{fontWeight:700}}>{IDR(item.subtotal)}</span></td>
                      <td><button className="btn btn-d btn-xs" onClick={()=>removeItem(idx)}>×</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <button className="btn btn-s btn-sm" onClick={addItem}>+ Tambah Baris</button>
            <div style={{fontWeight:800,fontSize:16}}>
              Total: <span style={{color:C.green}}>{IDR(totalAmount)}</span>
            </div>
          </div>
          {form.payment_type==='hutang_sebagian'&&totalAmount>0&&(
            <div className="alert-b" style={{marginBottom:12}}>
              <span>💡 Total: {IDR(totalAmount)} | DP: {IDR(form.down_payment||0)} | Sisa Hutang: <strong>{IDR(totalAmount-(Number(form.down_payment)||0))}</strong></span>
            </div>
          )}
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={save} disabled={loading}>
              {loading&&<span className="spin"/>}Simpan Faktur
            </button>
          </div>
        </Modal>
      )}

      {/* DETAIL MODAL */}
      {detailM&&(
        <Modal title={`Detail Faktur: ${detailM.invoice?.invoice_no}`} onClose={()=>setDetailM(null)} wide>
          <div className="g2" style={{marginBottom:14}}>
            <div>
              <div style={{fontSize:11,color:C.gray}}>Distributor</div>
              <div style={{fontWeight:700,fontSize:15}}>{detailM.invoice?.distributor_name}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.gray}}>Status</div>
              <StatusBadge status={detailM.invoice?.status}/>
            </div>
            <div>
              <div style={{fontSize:11,color:C.gray}}>Tgl Faktur</div>
              <div style={{fontWeight:600}}>{fmtDate(detailM.invoice?.invoice_date)}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:C.gray}}>Jatuh Tempo</div>
              <div style={{fontWeight:600,color:detailM.invoice?.status==='overdue'?C.red:C.text}}>{fmtDate(detailM.invoice?.due_date)}</div>

/* ── HUTANG DISTRIBUTOR SCREEN ── */
function HutangScreen({user,showToast}){
  const [debts,setDebts]=useState([]);
  const [summary,setSummary]=useState({});
  const [statusF,setStatusF]=useState('all');
  const [srch,setSrch]=useState('');
  const [from,setFrom]=useState('');
  const [to,setTo]=useState('');
  const [payModal,setPayModal]=useState(null);
  const [payForm,setPayForm]=useState({});
  const [histModal,setHistModal]=useState(null);
  const [loading,setLoading]=useState(false);

  const load=()=>{
    let url='/supplier-debts?';
    if(statusF!=='all')url+=`status=${statusF}&`;
    if(from)url+=`from=${from}&`;
    if(to)url+=`to=${to}&`;
    if(srch)url+=`search=${encodeURIComponent(srch)}`;
    API.get(url).then(r=>{setDebts(r.data);setSummary(r.summary||{});}).catch(()=>{});
  };
  useEffect(()=>{load();},[statusF,from,to]);

  const openPay=inv=>{
    setPayForm({
      payment_date:today(),
      amount:inv.remaining_amount,
      method:'transfer',
      notes:'',
    });
    setPayModal(inv);
  };

  const doPay=async()=>{
    if(!payForm.amount||Number(payForm.amount)<=0){showToast('Nominal tidak valid','error');return;}
    setLoading(true);
    try{
      await API.post(`/supplier-debts/${payModal.id}/pay`,{
        ...payForm,
        amount:Number(payForm.amount),
        user_id:user.id,user_name:user.name,
      });
      showToast('Pembayaran berhasil dicatat','ok');
      setPayModal(null);load();
    }catch(e){showToast(e.message,'error');}
    setLoading(false);
  };

  const openHist=async inv=>{
    try{
      const r=await API.get(`/supplier-debts/${inv.id}/payments`);
      setHistModal({inv,payments:r.data});
    }catch(e){showToast(e.message,'error');}
  };

  const statusTabs=['all','overdue','unpaid','partial','paid'];
  const statusLabel={all:'Semua',overdue:'⚠ Jatuh Tempo',unpaid:'Belum Lunas',partial:'Sebagian',paid:'Lunas'};

  return(
    <div>
      <div className="page-header">
        <div className="page-title">💳 Hutang Distributor</div>
        <a className="btn btn-b btn-sm" href="/api/export/debts" target="_blank">⬇ Export Excel</a>
      </div>

      {/* Summary Alert */}
      {(summary.overdue_count||0)>0&&(
        <div className="alert-w alert-r" style={{marginBottom:14}}>
          ⚠ Ada <strong>{summary.overdue_count} faktur</strong> yang sudah jatuh tempo dengan total hutang <strong>{IDR(summary.overdue_amount)}</strong>! Segera lakukan pembayaran.
        </div>
      )}

      {/* Summary Cards */}
      <div className="g4" style={{marginBottom:16}}>
        <div className="metric amber">
          <div className="m-lbl">Total Hutang Aktif</div>
          <div className="m-val amber" style={{fontSize:16}}>{IDR(summary.total_debt||0)}</div>
          <div className="m-sub">{summary.active_count||0} faktur aktif</div>
        </div>
        <div className="metric red">
          <div className="m-lbl">Hutang Jatuh Tempo</div>
          <div className="m-val red" style={{fontSize:16}}>{IDR(summary.overdue_amount||0)}</div>
          <div className="m-sub">{summary.overdue_count||0} faktur overdue</div>
        </div>
        <div className="metric">
          <div className="m-lbl">Faktur Belum Lunas</div>
          <div className="m-val">{debts.filter(d=>d.status!=='paid').length}</div>
        </div>
        <div className="metric">
          <div className="m-lbl">Faktur Lunas</div>
          <div className="m-val" style={{color:C.green}}>{debts.filter(d=>d.status==='paid').length}</div>
        </div>
      </div>

      <div className="filter-bar">
        <div className="srch" style={{minWidth:240}}>
          <span className="srch-ico">🔍</span>
          <input value={srch} onChange={e=>setSrch(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="Cari no faktur / distributor..."/>
        </div>
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:'auto'}} placeholder="Dari"/>
        <span style={{fontSize:12,color:C.gray}}>s/d</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:'auto'}}/>
        <button className="btn btn-s btn-sm" onClick={load}>Tampilkan</button>
      </div>

      <div className="tabs" style={{marginBottom:12}}>
        {statusTabs.map(s=>(
          <div key={s} className={'tab'+(statusF===s?' on':'')} onClick={()=>setStatusF(s)}>{statusLabel[s]}</div>
        ))}
      </div>

      <div className="tbl-wrap">
        <div className="tbl-scroll">
          <table>
            <thead><tr>
              <th>No Faktur</th><th>Distributor</th><th>Tgl Faktur</th><th>Jatuh Tempo</th>
              <th>Total Faktur</th><th>Sudah Bayar</th><th>Sisa Hutang</th><th>Status</th><th>Aksi</th>
            </tr></thead>
            <tbody>
              {debts.map(d=>(
                <tr key={d.id} style={{background:d.status==='overdue'?'#fff5f5':undefined}}>
                  <td><span style={{fontFamily:'monospace',fontWeight:700,fontSize:12}}>{d.invoice_no}</span></td>
                  <td>
                    <div style={{fontWeight:600}}>{d.distributor_name}</div>
                    {d.sales_name&&<div style={{fontSize:11,color:C.gray}}>Sales: {d.sales_name}</div>}
                  </td>
                  <td>{fmtDate(d.invoice_date)}</td>
                  <td>
                    <span style={{color:d.status==='overdue'?C.red:d.due_date&&d.due_date<=today()?C.amber:C.text,fontWeight:d.status==='overdue'?700:400}}>
                      {fmtDate(d.due_date)}
                    </span>
                  </td>
                  <td><span className="price">{IDR(d.total_amount)}</span></td>
                  <td><span className="price" style={{color:C.green}}>{IDR(d.paid_amount)}</span></td>
                  <td><span className="price" style={{color:d.remaining_amount>0?C.red:C.green,fontWeight:700,fontSize:14}}>{IDR(d.remaining_amount)}</span></td>
                  <td><StatusBadge status={d.status}/></td>
                  <td>
                    <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                      {d.status!=='paid'&&<button className="btn btn-p btn-xs" onClick={()=>openPay(d)}>💰 Bayar</button>}
                      <button className="btn btn-s btn-xs" onClick={()=>openHist(d)}>📋 Riwayat</button>
                    </div>
                  </td>
                </tr>
              ))}
              {debts.length===0&&<tr><td colSpan={9} style={{textAlign:'center',color:C.gray,padding:24}}>Tidak ada data hutang</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {/* PAYMENT MODAL */}
      {payModal&&(
        <Modal title={`Bayar Hutang: ${payModal.invoice_no}`} onClose={()=>setPayModal(null)}>
          <div style={{background:C.amberL,borderRadius:8,padding:'12px 14px',marginBottom:16}}>
            <div style={{fontSize:12,color:C.gray}}>Distributor</div>
            <div style={{fontWeight:700,fontSize:15}}>{payModal.distributor_name}</div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
              <div>
                <div style={{fontSize:11,color:C.gray}}>Total Faktur</div>
                <div style={{fontWeight:700}}>{IDR(payModal.total_amount)}</div>
              </div>
              <div>
                <div style={{fontSize:11,color:C.gray}}>Sudah Dibayar</div>
                <div style={{fontWeight:700,color:C.green}}>{IDR(payModal.paid_amount)}</div>
              </div>
              <div>
                <div style={{fontSize:11,color:C.gray}}>Sisa Hutang</div>
                <div style={{fontWeight:800,fontSize:18,color:C.red}}>{IDR(payModal.remaining_amount)}</div>
              </div>
            </div>
          </div>
          <div className="g2">
            <div className="fg"><label className="fl">Tanggal Bayar *</label>
              <input type="date" value={payForm.payment_date||today()} onChange={e=>setPayForm(f=>({...f,payment_date:e.target.value}))}/>
            </div>
            <div className="fg"><label className="fl">Metode Pembayaran</label>
              <select value={payForm.method||'transfer'} onChange={e=>setPayForm(f=>({...f,method:e.target.value}))}>
                <option value="transfer">Transfer Bank</option>
                <option value="cash">Cash</option>
                <option value="giro">Giro / Cek</option>
                <option value="qris">QRIS</option>
              </select>
            </div>
          </div>
          <div className="fg"><label className="fl">Nominal Pembayaran (Rp) *</label>
            <input type="number" value={payForm.amount||''} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))} placeholder="0"/>
          </div>
          <div className="fg"><label className="fl">Catatan</label>
            <input value={payForm.notes||''} onChange={e=>setPayForm(f=>({...f,notes:e.target.value}))} placeholder="Opsional"/>
          </div>
          {Number(payForm.amount)>0&&Number(payForm.amount)<=payModal.remaining_amount&&(
            <div style={{background:C.greenP,borderRadius:8,padding:'10px 14px',marginBottom:12}}>
              Sisa hutang setelah bayar: <strong style={{color:payModal.remaining_amount-Number(payForm.amount)<=0?C.green:C.red}}>
                {IDR(payModal.remaining_amount-Number(payForm.amount))}
              </strong>
              {payModal.remaining_amount-Number(payForm.amount)<=0&&' ✓ LUNAS'}
            </div>
          )}
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-s btn-sm" style={{flex:1}} onClick={()=>setPayForm(f=>({...f,amount:payModal.remaining_amount}))}>
              Bayar Lunas ({IDR(payModal.remaining_amount)})
            </button>
            <button className="btn btn-p btn-sm" style={{flex:1}} onClick={doPay} disabled={loading}>
              {loading&&<span className="spin"/>}Simpan Pembayaran
            </button>
          </div>
        </Modal>
      )}

      {/* HISTORY MODAL */}
      {histModal&&(
        <Modal title={`Riwayat Pembayaran: ${histModal.inv?.invoice_no}`} onClose={()=>setHistModal(null)} wide>
          <div style={{background:C.greenP,borderRadius:8,padding:'10px 14px',marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div><div style={{fontSize:11,color:C.gray}}>Total Faktur</div><div style={{fontWeight:700}}>{IDR(histModal.inv?.total_amount)}</div></div>
              <div><div style={{fontSize:11,color:C.gray}}>Total Dibayar</div><div style={{fontWeight:700,color:C.green}}>{IDR(histModal.inv?.paid_amount)}</div></div>
              <div><div style={{fontSize:11,color:C.gray}}>Sisa</div><div style={{fontWeight:700,color:histModal.inv?.remaining_amount>0?C.red:C.green}}>{IDR(histModal.inv?.remaining_amount)}</div></div>
              <div><div style={{fontSize:11,color:C.gray}}>Status</div><StatusBadge status={histModal.inv?.status}/></div>
            </div>
          </div>
          {histModal.payments?.length===0
            ?<div style={{textAlign:'center',color:C.gray,padding:24}}>Belum ada pembayaran</div>
            :<table>
              <thead><tr><th>#</th><th>Tgl Bayar</th><th>Metode</th><th>Nominal</th><th>Oleh</th><th>Catatan</th></tr></thead>
              <tbody>
                {histModal.payments.map((p,i)=>(
                  <tr key={p.id}>
                    <td>{i+1}</td>
                    <td>{fmtDate(p.payment_date)}</td>
                    <td><span className="tag tgy">{p.method}</span></td>

                    <td>{p.created_by_name||'-'}</td>
                    <td>{p.notes||'-'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          }
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:14}}>
            <button className="btn btn-s btn-sm" onClick={()=>setHistModal(null)}>Tutup</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ── KAS SCREEN ── */
function KasScreen({user,showToast}){
  const [txs,setTxs]=useState([]);
  const [balance,setBalance]=useState(0);
  const [totalIn,setTotalIn]=useState(0);
  const [totalOut,setTotalOut]=useState(0);
  const [typeF,setTypeF]=useState('all');
  const [from,setFrom]=useState(monthStart());
  const [to,setTo]=useState(today());
  const [srch,setSrch]=useState('');
  const [addModal,setAddModal]=useState(null);
  const [form,setForm]=useState({});

  const load=()=>{
    let url=`/cash?from=${from}&to=${to}`;
    if(typeF!=='all')url+=`&type=${typeF}`;
    if(srch)url+=`&search=${encodeURIComponent(srch)}`;
    API.get(url).then(r=>{
      setTxs(r.data);setBalance(r.balance||0);
      setTotalIn(r.total_in||0);setTotalOut(r.total_out||0);
    }).catch(()=>{});
  };
  useEffect(()=>{load();},[from,to,typeF]);

  const saveManual=async()=>{
    if(!form.category||!form.amount||!form.type){showToast('Lengkapi data','error');return;}
    try{
      await API.post('/cash',{...form,amount:Number(form.amount),user_id:user.id,user_name:user.name});
      showToast('Transaksi kas dicatat','ok');setAddModal(null);load();
    }catch(e){showToast(e.message,'error');}
  };

  return(
    <div>
      <div className="page-header">
        <div className="page-title">💰 Kas</div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-p btn-sm" onClick={()=>{setForm({type:'in',category:'',reference:'',description:'',amount:'',date:today()});setAddModal(true);}}>+ Kas Manual</button>
          <a className="btn btn-b btn-sm" href={`/api/export/cash?from=${from}&to=${to}`} target="_blank">⬇ Excel</a>
        </div>

      {/* Balance Cards */}
      <div className="g3" style={{marginBottom:16}}>
        <div className="metric" style={{background:'#f0fff4',borderColor:'#86efac'}}>
          <div className="m-lbl">💰 Saldo Kas Saat Ini</div>
          <div className="m-val" style={{fontSize:24,color:balance>=0?C.green:C.red}}>{IDR(balance)}</div>
          <div className="m-sub">Realtime</div>
        </div>
        <div className="metric">
          <div className="m-lbl">⬇ Kas Masuk (Periode)</div>
          <div className="m-val" style={{color:C.green,fontSize:18}}>{IDR(totalIn)}</div>
        </div>
        <div className="metric amber">
          <div className="m-lbl">⬆ Kas Keluar (Periode)</div>
          <div className="m-val amber" style={{fontSize:18}}>{IDR(totalOut)}</div>
        </div>
      </div>

      <div className="filter-bar">
        <div className="srch" style={{minWidth:240}}>
          <span className="srch-ico">🔍</span>
          <input value={srch} onChange={e=>setSrch(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="Cari referensi / kategori..."/>
        </div>
        <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:'auto'}}/>
        <span style={{fontSize:12,color:C.gray}}>s/d</span>
        <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:'auto'}}/>
        <button className="btn btn-s btn-sm" onClick={load}>Tampilkan</button>
        <div className="tabs">
          {[['all','Semua'],['in','Masuk'],['out','Keluar']].map(([k,l])=>(
            <div key={k} className={'tab'+(typeF===k?' on':'')} onClick={()=>setTypeF(k)}>{l}</div>
          ))}
        </div>
      </div>

      <div className="tbl-wrap">
        <div className="tbl-scroll">
          <table>
            <thead><tr>
              <th>Tanggal</th><th>Tipe</th><th>Kategori</th><th>Referensi</th><th>Keterangan</th>
              <th style={{textAlign:'right'}}>Kas Masuk</th><th style={{textAlign:'right'}}>Kas Keluar</th><th style={{textAlign:'right'}}>Saldo</th>
            </tr></thead>
            <tbody>
              {[...txs].reverse().map(t=>(
                <tr key={t.id} style={{background:t.type==='in'?'#fafffe':'#fffcfc'}}>
                  <td>{fmtDate(t.date)}</td>
                  <td>{t.type==='in'?<span className="tag tg">⬇ Masuk</span>:<span className="tag tr">⬆ Keluar</span>}</td>
                  <td><span className="tag tgy">{t.category}</span></td>
                  <td><span style={{fontFamily:'monospace',fontSize:12}}>{t.reference||'-'}</span></td>
                  <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.description||'-'}</td>
                  <td style={{textAlign:'right'}}>{t.type==='in'?<span style={{color:C.green,fontWeight:700}}>{IDR(t.amount)}</span>:'-'}</td>
                  <td style={{textAlign:'right'}}>{t.type==='out'?<span style={{color:C.red,fontWeight:700}}>{IDR(t.amount)}</span>:'-'}</td>
                  <td style={{textAlign:'right'}}><span style={{fontFamily:'monospace',fontWeight:700,color:t.balance>=0?C.text:C.red}}>{IDR(t.balance)}</span></td>
                </tr>
              ))}
              {txs.length===0&&<tr><td colSpan={8} style={{textAlign:'center',color:C.gray,padding:24}}>Tidak ada transaksi pada periode ini</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {addModal&&(
        <Modal title="Tambah Kas Manual" onClose={()=>setAddModal(null)}>
          <div className="fg"><label className="fl">Tipe *</label>
            <select value={form.type||'in'} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
              <option value="in">Kas Masuk</option>
              <option value="out">Kas Keluar</option>
            </select>
          </div>
          <div className="fg"><label className="fl">Tanggal *</label>
            <input type="date" value={form.date||today()} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
          </div>
          <div className="fg"><label className="fl">Kategori *</label>
            <select value={form.category||''} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              <option value="">-- Pilih Kategori --</option>
              {form.type==='in'
                ?['Penjualan','Modal','Pinjaman','Pendapatan Lain'].map(c=><option key={c} value={c}>{c}</option>)
                :['Biaya Operasional','Gaji','Sewa','Listrik & Air','Transport','Biaya Lain'].map(c=><option key={c} value={c}>{c}</option>)
              }
            </select>
          </div>
          <div className="fg"><label className="fl">Referensi</label>
            <input value={form.reference||''} onChange={e=>setForm(f=>({...f,reference:e.target.value}))} placeholder="No. bukti / referensi"/>
          </div>
          <div className="fg"><label className="fl">Keterangan</label>
            <input value={form.description||''} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Keterangan transaksi"/>
          </div>
          <div className="fg"><label className="fl">Nominal (Rp) *</label>
            <input type="number" value={form.amount||''} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0"/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setAddModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={saveManual}>Simpan</button>
          </div>
        </Modal>
      )}
    </div>
  );
}


/* ── LAPORAN KEUANGAN SCREEN ── */
function LaporanKeuScreen({user,showToast}){
  const [activeTab,setActiveTab]=useState('cashflow');
  const [from,setFrom]=useState(monthStart());
  const [to,setTo]=useState(today());
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);

  const load=async()=>{
    setLoading(true);
    try{
      if(activeTab==='cashflow'){
        const r=await API.get(`/reports/cash-flow?from=${from}&to=${to}`);
        setData(r.data);
      } else if(activeTab==='purchases'){
        const r=await API.get(`/reports/purchases?from=${from}&to=${to}`);
        setData(r.data);
      } else if(activeTab==='debts'){
        const r=await API.get('/reports/debts');
        setData(r.data);
      }
    }catch(e){showToast(e.message,'error');}
    setLoading(false);
  };
  useEffect(()=>{load();},[activeTab,from,to]);

  const tabs=[
    {id:'cashflow',label:'📊 Arus Kas'},
    {id:'purchases',label:'🛍 Laporan Pembelian'},
    {id:'debts',label:'💳 Laporan Hutang'},
  ];

  return(

                  <th>Total</th><th>Dibayar</th><th>Sisa Hutang</th><th>Status</th>
                </tr></thead>
                <tbody>
                  {data.debts?.map(d=>(
                    <tr key={d.id} style={{background:d.status==='overdue'?'#fff5f5':undefined}}>
                      <td style={{fontFamily:'monospace',fontSize:12,fontWeight:700}}>{d.invoice_no}</td>
                      <td>{d.distributor_name}</td>
                      <td>{fmtDate(d.invoice_date)}</td>
                      <td style={{color:d.status==='overdue'?C.red:C.text,fontWeight:d.status==='overdue'?700:400}}>{fmtDate(d.due_date)}</td>
                      <td><span className="price">{IDR(d.total_amount)}</span></td>
                      <td><span className="price" style={{color:C.green}}>{IDR(d.paid_amount)}</span></td>
                      <td><span className="price" style={{color:d.remaining_amount>0?C.red:C.green,fontWeight:700}}>{IDR(d.remaining_amount)}</span></td>

/* ── REPORTS SCREEN (existing, extended) ── */
function ReportsScreen({user,lang}){
  const t=T[lang];
  const [data,setData]=useState(null);
  const [range,setRange]=useState('today');
  const [from,setFrom]=useState(today());
  const [to,setTo]=useState(today());

  const load=async()=>{
    const f=range==='today'?today():range==='weekly'?addDays(today(),-7):range==='monthly'?monthStart():from;
    const t2=range==='custom'?to:today();
    try{const r=await API.get(`/reports/summary?from=${f}&to=${t2}`);setData(r.data);}catch(e){}
  };
  useEffect(()=>{load();},[range,from,to]);

  if(!data)return<div style={{padding:40,textAlign:'center',color:C.gray}}>Memuat laporan...</div>;
  const maxDay=Math.max(...(data.daily||[]).map(d=>d.total),1);
  return(
    <div>
      <div className="page-header"><div className="page-title">📊 Laporan Penjualan</div></div>
      <div className="filter-bar" style={{marginBottom:16}}>
        <div className="tabs">
          {[['today',t.daily],['weekly',t.weekly],['monthly',t.monthly],['custom',t.custom]].map(([k,l])=>(
            <div key={k} className={'tab'+(range===k?' on':'')} onClick={()=>setRange(k)}>{l}</div>
          ))}
        </div>
        {range==='custom'&&<>
          <input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={{width:'auto'}}/>
          <span style={{fontSize:12,color:C.gray}}>s/d</span>
          <input type="date" value={to} onChange={e=>setTo(e.target.value)} style={{width:'auto'}}/>
          <button className="btn btn-s btn-sm" onClick={load}>Tampilkan</button>
        </>}
      </div>

      <div className="g4" style={{marginBottom:16}}>
        <div className="metric"><div className="m-lbl">{t.revenue}</div><div className="m-val" style={{fontSize:18}}>{IDR(data.revenue)}</div><div className="m-sub">{data.tx_count} transaksi</div></div>
        <div className="metric"><div className="m-lbl">{t.profit}</div><div className="m-val" style={{fontSize:18,color:C.green}}>{IDR(data.profit)}</div></div>
        <div className="metric"><div className="m-lbl">{t.items} Terjual</div><div className="m-val">{data.items_sold}</div></div>
        <div className="metric amber"><div className="m-lbl">Hutang Pelanggan</div><div className="m-val amber" style={{fontSize:18}}>{IDR(data.total_debt)}</div></div>
      </div>

      {data.daily?.length>0&&<div className="card" style={{marginBottom:16}}>
        <div className="section-title">Grafik Penjualan</div>
        <div className="chart-wrap">
          {data.daily.map(d=>(
            <div key={d.date} className="chart-col">
              <div className="bar" style={{height:Math.max(8,(d.total/maxDay)*90)+'px'}} title={IDR(d.total)}/>
              <div className="bar-lbl">{d.date.slice(5)}</div>
            </div>
          ))}
        </div>
      </div>}

      <div className="g2">
        <div className="card">
          <div className="section-title">{t.topProducts}</div>
          {data.top_products?.map((p,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f0f8f2',fontSize:13}}>
              <span><span style={{color:C.gray,marginRight:8}}>#{i+1}</span>{p.name}</span>
              <span style={{fontWeight:700}}>{IDR(p.revenue)}</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="section-title">Metode Pembayaran</div>
          {Object.entries(data.method_break||{}).map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f0f8f2',fontSize:13}}>
              <span style={{textTransform:'capitalize'}}>{k}</span>
              <span style={{fontWeight:700}}>{IDR(v)}</span>
            </div>
          ))}
          <div className="divider"/>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
            <span>{t.stockValue}</span>
            <span style={{fontWeight:700}}>{IDR(data.stock_value)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── SETTINGS SCREEN ── */
function SettingsScreen({user,lang,setLang,showToast,settings,loadSettings}){
  const t=T[lang];
  const [form,setForm]=useState({...settings});
  const [cats,setCats]=useState([]);
  const [newCat,setNewCat]=useState('');
  const [users,setUsers]=useState([]);
  const [uModal,setUModal]=useState(null);
  const [uForm,setUForm]=useState({});
  const [actLog,setActLog]=useState([]);

  useEffect(()=>{
    API.get('/activity_log?limit=100').then(r=>setActLog(r.data)).catch(()=>{});
    API.get('/users').then(r=>setUsers(r.data)).catch(()=>{});
    API.get('/categories').then(r=>setCats(r.data)).catch(()=>{});
  },[]);

  const saveSettings=async()=>{
    try{await API.put('/settings',form);await loadSettings();showToast('Pengaturan disimpan','ok');}
    catch(e){showToast(e.message,'error');}
  };

  const addCat=async()=>{
    if(!newCat.trim())return;
    try{await API.post('/categories',{name:newCat.trim()});setNewCat('');API.get('/categories').then(r=>setCats(r.data));showToast('Ditambahkan','ok');}
    catch(e){showToast(e.message,'error');}
  };
  const delCat=async c=>{
    try{await API.delete('/categories/'+c.id);API.get('/categories').then(r=>setCats(r.data));}
    catch(e){showToast(e.message,'error');}
  };

  const saveUser=async()=>{
    try{
      if(uModal==='add')await API.post('/users',uForm);
      else await API.put('/users/'+uForm.id,uForm);
      showToast('User disimpan','ok');setUModal(null);API.get('/users').then(r=>setUsers(r.data));
    }catch(e){showToast(e.message,'error');}
  };

  return(
    <div>
      <div className="page-title" style={{marginBottom:18}}>⚙️ Pengaturan</div>
      <div className="g2">
        <div>
          <div className="card" style={{marginBottom:14}}>
            <div className="section-title">Informasi Toko</div>
            <div className="fg"><label className="fl">Nama Toko</label><input value={form.storeName||''} onChange={e=>setForm(f=>({...f,storeName:e.target.value}))}/></div>
            <div className="fg"><label className="fl">Alamat</label><input value={form.storeAddr||''} onChange={e=>setForm(f=>({...f,storeAddr:e.target.value}))}/></div>
            <div className="fg"><label className="fl">Info Bank / QRIS</label><textarea value={form.bankInfo||''} onChange={e=>setForm(f=>({...f,bankInfo:e.target.value}))} rows={2}/></div>
            <div className="fg"><label className="fl">Footer Struk</label><input value={form.receiptFooter||''} onChange={e=>setForm(f=>({...f,receiptFooter:e.target.value}))}/></div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <label style={{fontSize:13,fontWeight:600}}>Pajak (PPN)</label>
              <input type="checkbox" checked={form.tax==='1'} onChange={e=>setForm(f=>({...f,tax:e.target.checked?'1':'0'}))} style={{width:'auto'}}/>
              {form.tax==='1'&&<input type="number" value={form.taxPct||11} onChange={e=>setForm(f=>({...f,taxPct:e.target.value}))} style={{width:60}} placeholder="11"/>}
              {form.tax==='1'&&<span style={{fontSize:13}}>%</span>}
            </div>
            <button className="btn btn-p btn-sm" onClick={saveSettings}>Simpan Pengaturan</button>
          </div>

          <div className="card" style={{marginBottom:14}}>
            <div className="section-title">Kategori Produk</div>
            <div style={{display:'flex',gap:8,marginBottom:10}}>
              <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCat()} placeholder="Nama kategori baru" style={{flex:1}}/>
              <button className="btn btn-p btn-sm" onClick={addCat}>Tambah</button>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {cats.map(c=>(
                <span key={c.id} style={{background:C.greenL,color:C.green,borderRadius:20,padding:'4px 12px',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
                  {c.name}
                  <button onClick={()=>delCat(c)} style={{background:'none',border:'none',color:C.red,cursor:'pointer',fontSize:14,lineHeight:1}}>×</button>
                </span>
              ))}
            </div>
          </div>

          <div className="card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <div className="section-title" style={{margin:0}}>Manajemen User</div>
              <button className="btn btn-p btn-xs" onClick={()=>{setUForm({username:'',name:'',role:'cashier',password:''});setUModal('add');}}>+ Tambah User</button>
            </div>
            <table>
              <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Aksi</th></tr></thead>
              <tbody>
                {users.map(u=>(
                  <tr key={u.id}>
                    <td>{u.name}</td><td>{u.username}</td>
                    <td><span className={'badge '+(u.role==='owner'?'badge-g':u.role==='admin'?'badge-a':'tgy tag')}>{u.role}</span></td>
                    <td><button className="btn btn-s btn-xs" onClick={()=>{setUForm({...u,password:''});setUModal('edit');}}>Edit</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <div className="card" style={{marginBottom:14}}>
            <div className="section-title">Bahasa</div>
            <div className="lang-row" style={{display:'inline-flex'}}>
              <button className={'lang-btn'+(lang==='id'?' on':'')} onClick={()=>{setLang('id');API.put('/settings',{lang:'id'});}}>🇮🇩 Bahasa Indonesia</button>
              <button className={'lang-btn'+(lang==='en'?' on':'')} onClick={()=>{setLang('en');API.put('/settings',{lang:'en'});}}>🇺🇸 English</button>
            </div>
          </div>

          <div className="card" style={{marginBottom:14}}>
            <div className="section-title">Backup Data</div>
            <p style={{fontSize:12,color:C.gray,marginBottom:10}}>Download backup semua data toko dalam format JSON.</p>
            <a className="btn btn-s btn-sm" href="/api/backup" target="_blank">⬇ Download Backup</a>
          </div>

          <div className="card">
            <div className="section-title">Log Aktivitas</div>
            <div style={{maxHeight:280,overflowY:'auto'}}>
              {actLog.map(a=>(
                <div key={a.id} style={{padding:'6px 0',borderBottom:'1px solid #f0f8f2',fontSize:12}}>
                  <div style={{fontWeight:600}}>{a.action} <span style={{color:C.gray,fontWeight:400}}>— {a.detail}</span></div>
                  <div style={{color:C.gray,fontSize:11}}>{fmtDT(a.date)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {uModal&&(
        <Modal title={uModal==='add'?'Tambah User':'Edit User'} onClose={()=>setUModal(null)}>
          <div className="fg"><label className="fl">Nama Lengkap</label><input value={uForm.name||''} onChange={e=>setUForm(f=>({...f,name:e.target.value}))}/></div>
          <div className="fg"><label className="fl">Username</label><input value={uForm.username||''} onChange={e=>setUForm(f=>({...f,username:e.target.value}))} disabled={uModal==='edit'}/></div>
          <div className="fg"><label className="fl">{uModal==='edit'?'Password Baru (kosongkan jika tidak diubah)':'Password'}</label>
            <input type="password" value={uForm.password||''} onChange={e=>setUForm(f=>({...f,password:e.target.value}))}/>
          </div>
          <div className="fg"><label className="fl">Role</label>
            <select value={uForm.role||'cashier'} onChange={e=>setUForm(f=>({...f,role:e.target.value}))}>
              <option value="cashier">Kasir</option>
              <option value="admin">Admin</option>
              <option value="owner">Pemilik</option>
            </select>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setUModal(null)}>Batal</button>
            <button className="btn btn-p btn-sm" onClick={saveUser}>Simpan</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

  const load=()=>{
    API.get('/dashboard').then(r=>setData(r.data)).catch(e=>showToast(e.message,'error'));
  };
  useEffect(()=>{load();},[]);

  if(!data)return<div style={{padding:40,textAlign:'center',color:C.gray}}>Memuat dashboard...</div>;

  const {sales_month,purchase_month,debt_stats,due_today,due_7days,overdue,
         cash_balance,kas_masuk_month,kas_keluar_month,dist_count,top_debtors,low_stock,out_stock}=data;

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div className="page-title">📊 Dashboard</div>
        <button className="btn btn-s btn-sm" onClick={load}>🔄 Refresh</button>
